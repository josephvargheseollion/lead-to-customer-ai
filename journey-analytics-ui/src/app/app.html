<div class="container mt-4">

  <h2 class="mb-4">{{ title }}</h2>
  <!-- ===== FILE UPLOAD BOX (Ollion-style) ===== -->
  <div class="upload-box p-4 mb-4 border rounded shadow-sm">
    <h5 class="mb-3">Upload Customer Journey CSV</h5>

    <div class="d-flex align-items-center gap-3">
      <input type="file" class="form-control" (change)="onFileSelected($event)" accept=".csv" />

      <button class="btn btn-primary" [disabled]="!selectedFile" (click)="uploadFile()">
        Analyze
      </button>
    </div>

    <div *ngIf="uploadMessage" class="mt-3 alert alert-info">
      {{ uploadMessage }}
    </div>
  </div>
  <!-- ===== END UPLOAD BOX ===== -->
  <ul class="nav nav-tabs">
    <li class="nav-item" *ngFor="let tab of tabs">
      <a class="nav-link" [class.active]="activeTab === tab.id" href="javascript:void(0)" (click)="setTab(tab.id)">
        <i [class]="tab.icon"></i> {{ tab.label }}
      </a>
    </li>
  </ul>

  <div class="mt-4" [ngSwitch]="activeTab">

    <app-overview *ngSwitchCase="'overview'"></app-overview>
    <app-sankey *ngSwitchCase="'sankey'"></app-sankey>
    <app-markov *ngSwitchCase="'markov'"></app-markov>
    <app-funnel *ngSwitchCase="'funnel'"></app-funnel>
    <app-lengths *ngSwitchCase="'lengths'"></app-lengths>
    <app-heatmap *ngSwitchCase="'heatmap'"></app-heatmap>
    <app-top-journeys *ngSwitchCase="'top-journeys'"></app-top-journeys>

    <div *ngSwitchDefault>
      <p class="text-muted">Select a tab to begin.</p>
    </div>

  </div>

</div>
