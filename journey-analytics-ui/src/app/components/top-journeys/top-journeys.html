<div *ngIf="journeys.length === 0" class="alert alert-warning">
  No top journeys found.
</div>

<table *ngIf="journeys.length > 0" class="table table-striped table-bordered mt-3">
  <thead class="table-light">
    <tr>
      <th>Journey</th>
      <th>Count</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let j of journeys">
      <td>{{ j.journey }}</td>
      <td>{{ j.count }}</td>
    </tr>
  </tbody>
</table>
